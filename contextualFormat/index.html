<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul onclick="">
        <li> Item 1</li>
        <li> Item 2</li>
    </ul>
    <div id ="result">

    </div>
    <script type="module">
         function showInResult(str){
            const resultdiv = document.querySelector("#result");
            const ptoBeadded = document.createElement("p");
            ptoBeadded.innerText=str;
            resultdiv.appendChild(ptoBeadded);


         }
         const ul = document.querySelector("ul");
         ul.addEventListener("click",function(event){
            console.log(this);
            showInResult(this);
            showInResult(this.tagName);
            showInResult(event.target.tagName);
            showInResult(`handler is attached to ${event.currentTarget.tagName}`);
         })
    </script>
    
</body>
</html>
